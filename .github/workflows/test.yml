name: PHPUnit Tests

# Los tests solo se lanzan si el commit o la PR cambia algo que pueda alterar el
# comportamiento del programa. Si TODOS los archivos cambiados están en
# paths-ignore, el workflow no se ejecuta y no consume minutos.
# Las traducciones las valida aparte validate-translations.yml, mucho más barato.
on:
  push:
    branches: [ master, main ]
    paths-ignore: &ignored-paths
      # traducciones: se descargan de facturascripts.com y no cambian el código
      - 'Core/Translation/**'
      # JS, CSS, imágenes y fuentes: phpunit no los usa
      - 'Core/Assets/**'
      # documentación
      - '**.md'
      - 'Doc/**'
      - 'COPYING'
      # configuración de los asistentes de IA (Claude Code, Codex...)
      - '.claude/**'
      - '.agents/**'
      - '.codex/**'
      # configuración de plugins, de npm y del servidor web
      - '**/facturascripts.ini'
      - 'package.json'
      - 'package-lock.json'
      - 'htaccess-sample'
      # configuración de GitHub que no afecta a este workflow
      - '.github/codecov.yml'
      - '.github/VULNERABILITY_REPORT.yml'
      - '.github/workflows/test-countries.yml'
      - '.github/workflows/validate-translations.yml'
  pull_request:
    branches: [ master, main ]
    paths-ignore: *ignored-paths
  # permite lanzarlo a mano desde la pestaña Actions cuando se quiera forzar
  workflow_dispatch:

# Si llega un commit nuevo a la misma rama o PR, se cancela la ejecución
# anterior, que ya no sirve, en lugar de dejar que termine.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DB_NAME: facturascripts_test
  DB_USER: root
  DB_PASS: root
  DB_HOST: 127.0.0.1

jobs:
  test:
    runs-on: ubuntu-26.04
    # un job colgado no puede consumir las 6 horas por defecto
    timeout-minutes: 30

    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        database:
          - type: mysql
            version: '8.1'
            port: 3306
          - type: mariadb
            version: '11.0'
            port: 3306
          - type: postgresql
            version: '13'
            port: 5432
      fail-fast: false

    name: PHP ${{ matrix.php-version }} - ${{ matrix.database.type }} ${{ matrix.database.version }}

    services:
      mysql:
        image: ${{ matrix.database.type == 'mysql' && format('mysql:{0}', matrix.database.version) || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: facturascripts_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      mariadb:
        image: ${{ matrix.database.type == 'mariadb' && format('mariadb:{0}', matrix.database.version) || '' }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: facturascripts_test
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: false
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      postgres:
        image: ${{ matrix.database.type == 'postgresql' && format('postgres:{0}', matrix.database.version) || '' }}
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: facturascripts_test
          POSTGRES_USER: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d facturascripts_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: bcmath, curl, gd, iconv, mysqli, pdo_mysql, pdo_pgsql, pgsql, soap, zip, fileinfo, openssl, simplexml, mbstring, intl
          coverage: xdebug
          tools: composer:v2
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --optimize-autoloader

      - name: Verify database connection
        run: |
          if [ "${{ matrix.database.type }}" = "mysql" ] || [ "${{ matrix.database.type }}" = "mariadb" ]; then
            echo "Testing ${{ matrix.database.type }} ${{ matrix.database.version }} connection..."
            mysql --host=${{ env.DB_HOST }} --user=${{ env.DB_USER }} --password=${{ env.DB_PASS }} -e "SHOW DATABASES;"
            mysql --host=${{ env.DB_HOST }} --user=${{ env.DB_USER }} --password=${{ env.DB_PASS }} -e "SELECT VERSION();"
          else
            echo "Testing PostgreSQL ${{ matrix.database.version }} connection..."
            PGPASSWORD=${{ env.DB_PASS }} psql -h ${{ env.DB_HOST }} -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -c "\l"
            PGPASSWORD=${{ env.DB_PASS }} psql -h ${{ env.DB_HOST }} -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -c "SELECT version();"
          fi

      - name: Create application config
        run: |
          if [ "${{ matrix.database.type }}" = "mysql" ] || [ "${{ matrix.database.type }}" = "mariadb" ]; then
            cat > config.php << 'EOF'
          <?php
          define('FS_COOKIES_EXPIRE', 31536000);
          define('FS_ROUTE', '');
          define('FS_DB_TYPE', 'mysql');
          define('FS_DB_HOST', '${{ env.DB_HOST }}');
          define('FS_DB_PORT', 3306);
          define('FS_DB_NAME', '${{ env.DB_NAME }}');
          define('FS_DB_USER', '${{ env.DB_USER }}');
          define('FS_DB_PASS', '${{ env.DB_PASS }}');
          define('FS_DB_FOREIGN_KEYS', true);
          define('FS_DB_TYPE_CHECK', true);
          define('FS_MYSQL_CHARSET', 'utf8mb4');
          define('FS_MYSQL_COLLATE', 'utf8mb4_unicode_520_ci');
          define('FS_LANG', 'es_ES');
          define('FS_TIMEZONE', 'Europe/Madrid');
          define('FS_HIDDEN_PLUGINS', '');
          define('FS_DEBUG', true);
          define('FS_DISABLE_ADD_PLUGINS', false);
          define('FS_DISABLE_RM_PLUGINS', false);
          EOF
          else
            cat > config.php << 'EOF'
          <?php
          define('FS_COOKIES_EXPIRE', 31536000);
          define('FS_ROUTE', '');
          define('FS_DB_TYPE', 'postgresql');
          define('FS_DB_HOST', '${{ env.DB_HOST }}');
          define('FS_DB_PORT', 5432);
          define('FS_DB_NAME', '${{ env.DB_NAME }}');
          define('FS_DB_USER', '${{ env.DB_USER }}');
          define('FS_DB_PASS', '${{ env.DB_PASS }}');
          define('FS_DB_FOREIGN_KEYS', true);
          define('FS_DB_TYPE_CHECK', true);
          define('FS_LANG', 'es_ES');
          define('FS_TIMEZONE', 'Europe/Madrid');
          define('FS_HIDDEN_PLUGINS', '');
          define('FS_DEBUG', true);
          define('FS_DISABLE_ADD_PLUGINS', false);
          define('FS_DISABLE_RM_PLUGINS', false);
          EOF
          fi

      - name: Run PHPUnit tests
        run: |
          if [ "${{ matrix.php-version }}" = "8.3" ] && [ "${{ matrix.database.type }}" = "mysql" ] && [ "${{ matrix.database.version }}" = "8.1" ]; then
            vendor/bin/phpunit --coverage-clover=coverage.xml
          else
            vendor/bin/phpunit
          fi

      - name: Upload coverage reports
        if: matrix.php-version == '8.3' && matrix.database.type == 'mysql' && matrix.database.version == '8.1'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security-audit:
    runs-on: ubuntu-26.04
    name: Security Audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-dev --optimize-autoloader

      - name: Run security audit
        run: composer audit

  code-quality:
    runs-on: ubuntu-26.04
    name: Code Quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, phpcs, phpstan

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --optimize-autoloader

      - name: Run PHP CodeSniffer
        run: |
          if [ -f phpcs.xml ] || [ -f phpcs.xml.dist ]; then
            vendor/bin/phpcs
          else
            echo "No PHPCS configuration found, skipping..."
          fi
        continue-on-error: true

      - name: Run PHPStan
        run: |
          if [ -f phpstan.neon ] || [ -f phpstan.neon.dist ]; then
            phpstan analyse
          else
            echo "No PHPStan configuration found, skipping..."
          fi
        continue-on-error: true
